<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Empleados - Dashboard</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <style>
        .action-buttons {
            white-space: nowrap;
        }
        .action-buttons button {
            margin: 0 3px;
        }
    </style>
</head>

<body id="page-top">

    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-laugh-wink"></i>
                </div>
                <div class="sidebar-brand-text mx-3">SB Admin</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item active">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-fw fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <hr class="sidebar-divider">
            <li class="nav-item">
                <a class="nav-link" href="clientes.html">
                    <i class="fas fa-fw fa-user"></i>
                    <span>Clientes</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="empleados.html">
                    <i class="fas fa-fw fa-users"></i>
                    <span>Empleados</span>
                </a>
            </li>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Usuario</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Begin Page Content -->
                <div class="container-fluid">
                    <h1 class="h3 mb-2 text-gray-800">Lista de Empleados</h1>
                    <div class="card shadow mb-4">
                        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                            <h6 class="m-0 font-weight-bold text-primary">Empleados Registrados</h6>
                            <button class="btn btn-primary btn-sm" data-toggle="modal" data-target="#addEmpleadoModal">
                                <i class="fas fa-plus"></i> Agregar Empleado
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="empleadosTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre Completo</th>
                                            <th>Especialidad</th>
                                            <th>Contacto</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="empleadosBody">
                                        <!-- Aquí se insertarán los datos -->
                                    </tbody>
                                </table>                                
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; Tu Sitio 2025</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Modal para Agregar Empleado -->
    <div class="modal fade" id="addEmpleadoModal" tabindex="-1" role="dialog" aria-labelledby="addEmpleadoModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEmpleadoModalLabel">Agregar Nuevo Empleado</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addEmpleadoForm">
                        <div class="form-group">
                            <label for="nombreCompleto">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="especialidad">Especialidad</label>
                            <input type="text" class="form-control" id="especialidad">
                        </div>
                        <div class="form-group">
                            <label for="contacto">Contacto</label>
                            <input type="text" class="form-control" id="contacto">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveEmpleadoBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Empleado -->
    <div class="modal fade" id="editEmpleadoModal" tabindex="-1" role="dialog" aria-labelledby="editEmpleadoModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editEmpleadoModalLabel">Editar Empleado</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editEmpleadoForm">
                        <input type="hidden" id="editIdEmpleado">
                        <div class="form-group">
                            <label for="editNombreCompleto">Nombre Completo</label>
                            <input type="text" class="form-control" id="editNombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="editEspecialidad">Especialidad</label>
                            <input type="text" class="form-control" id="editEspecialidad">
                        </div>
                        <div class="form-group">
                            <label for="editContacto">Contacto</label>
                            <input type="text" class="form-control" id="editContacto">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="updateEmpleadoBtn">Actualizar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Confirmar Eliminación</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>¿Está seguro que desea eliminar a este empleado?</p>
                    <p id="deleteEmpleadoName" class="font-weight-bold"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript para CRUD de empleados -->
    <script>
        // URL base de la API
        const API_URL = " https://eae5-179-1-86-116.ngrok-free.app/api/Empleados";
        let empleadosList = [];
        
        // Al cargar la página
        document.addEventListener('DOMContentLoaded', loadEmpleados);
        
        // Cargar empleados desde la API
        async function loadEmpleados() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al obtener empleados: ${response.status} - ${errorText}`);
                }
        
                empleadosList = await response.json();
                renderEmpleadosTable();
                console.log('Empleados cargados:', empleadosList);
            } catch (error) {
                console.error('Error al cargar empleados:', error.message);
                alert('No se pudieron cargar los empleados: ' + error.message);
            }
        }
        
        // Renderizar tabla de empleados
        function renderEmpleadosTable() {
            const tablaBody = document.getElementById('empleadosBody');
            tablaBody.innerHTML = ''; // Limpiar antes de insertar
        
            empleadosList.forEach(empleado => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${empleado.idEmpleado}</td>
                    <td>${empleado.nombreCompleto || ''}</td>
                    <td>${empleado.especialidad || ''}</td>
                    <td>${empleado.contacto || ''}</td>
                    <td class="action-buttons">
                        <button class="btn btn-info btn-sm edit-btn" data-id="${empleado.idEmpleado}">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="${empleado.idEmpleado}" data-name="${empleado.nombreCompleto}">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                `;
                tablaBody.appendChild(row);
            });
            
            // Agregar event listeners a los botones
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', handleEditClick);
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', handleDeleteClick);
            });
        }
        
        // Agregar empleado
        document.getElementById('saveEmpleadoBtn').addEventListener('click', async function() {
            // Validar formulario
            const nombreCompleto = document.getElementById('nombreCompleto').value.trim();
            if (!nombreCompleto) {
                alert('El nombre completo es obligatorio');
                return;
            }
            
            try {
                const empleadoData = {
                    nombreCompleto: nombreCompleto,
                    especialidad: document.getElementById('especialidad').value.trim() || null,
                    contacto: document.getElementById('contacto').value.trim() || null
                };
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(empleadoData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al agregar empleado: ${response.status} - ${errorText}`);
                }
                
                // Recargar empleados
                await loadEmpleados();
                
                // Cerrar modal y limpiar formulario
                $('#addEmpleadoModal').modal('hide');
                document.getElementById('addEmpleadoForm').reset();
                
                // Mostrar confirmación
                alert('Empleado agregado correctamente');
                
            } catch (error) {
                console.error('Error al agregar empleado:', error.message);
                alert('No se pudo agregar el empleado: ' + error.message);
            }
        });
        
        // Manejar clic en botón Editar
        function handleEditClick(event) {
            const id = event.currentTarget.getAttribute('data-id');
            const empleado = empleadosList.find(e => e.idEmpleado === parseInt(id));
            
            if (empleado) {
                // Llenar formulario con datos del empleado
                document.getElementById('editIdEmpleado').value = empleado.idEmpleado;
                document.getElementById('editNombreCompleto').value = empleado.nombreCompleto || '';
                document.getElementById('editEspecialidad').value = empleado.especialidad || '';
                document.getElementById('editContacto').value = empleado.contacto || '';
                
                // Mostrar modal
                $('#editEmpleadoModal').modal('show');
            }
        }
        
        // Actualizar empleado
        document.getElementById('updateEmpleadoBtn').addEventListener('click', async function() {
            // Validar formulario
            const nombreCompleto = document.getElementById('editNombreCompleto').value.trim();
            const idEmpleado = document.getElementById('editIdEmpleado').value;
            
            if (!nombreCompleto) {
                alert('El nombre completo es obligatorio');
                return;
            }
            
            try {
                const empleadoData = {
                    idEmpleado: parseInt(idEmpleado),
                    nombreCompleto: nombreCompleto,
                    especialidad: document.getElementById('editEspecialidad').value.trim() || null,
                    contacto: document.getElementById('editContacto').value.trim() || null
                };
                
                const response = await fetch(`${API_URL}/${idEmpleado}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(empleadoData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al actualizar empleado: ${response.status} - ${errorText}`);
                }
                
                // Recargar empleados
                await loadEmpleados();
                
                // Cerrar modal
                $('#editEmpleadoModal').modal('hide');
                
                // Mostrar confirmación
                alert('Empleado actualizado correctamente');
                
            } catch (error) {
                console.error('Error al actualizar empleado:', error.message);
                alert('No se pudo actualizar el empleado: ' + error.message);
            }
        });
        
        // Manejar clic en botón Eliminar
        function handleDeleteClick(event) {
            const id = event.currentTarget.getAttribute('data-id');
            const name = event.currentTarget.getAttribute('data-name');
            
            // Mostrar nombre en modal de confirmación
            document.getElementById('deleteEmpleadoName').textContent = name;
            
            // Configurar botón de confirmación
            document.getElementById('confirmDeleteBtn').setAttribute('data-id', id);
            
            // Mostrar modal de confirmación
            $('#deleteConfirmModal').modal('show');
        }
        
        // Eliminar empleado
        document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
            const idEmpleado = this.getAttribute('data-id');
            
            try {
                const response = await fetch(`${API_URL}/${idEmpleado}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al eliminar empleado: ${response.status} - ${errorText}`);
                }
                
                // Recargar empleados
                await loadEmpleados();
                
                // Cerrar modal
                $('#deleteConfirmModal').modal('hide');
                
                // Mostrar confirmación
                alert('Empleado eliminado correctamente');
                
            } catch (error) {
                console.error('Error al eliminar empleado:', error.message);
                alert('No se pudo eliminar el empleado: ' + error.message);
                // Cerrar modal
                $('#deleteConfirmModal').modal('hide');
            }
        });
    </script>

</body>

</html>
