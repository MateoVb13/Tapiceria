<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Iniciar Sesión</title>

    <!-- Google Fonts y Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to right, #4e73df, #224abe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .bg-login-image {
            background: url('https://source.unsplash.com/600x800/?technology,login') no-repeat center center;
            background-size: cover;
            border-top-left-radius: 1rem;
            border-bottom-left-radius: 1rem;
        }

        .form-control {
            border-radius: 50px;
        }

        .btn-primary {
            border-radius: 50px;
            background-color: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2e59d9;
        }

        .input-group-text {
            border-radius: 50px 0 0 50px;
        }

        #resultado {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card my-5">
                    <div class="row no-gutters">
                        <div class="col-md-6 bg-login-image d-none d-md-block"></div>
                        <div class="col-md-6">
                            <div class="card-body p-5">
                                <div class="text-center">
                                    <h2 class="text-dark mb-4">¡Bienvenido!</h2>
                                    <p class="text-muted mb-4">Por favor inicia sesión para continuar</p>
                                </div>
                                <form id="form-login">
                                    <div class="form-group">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            </div>
                                            <input type="email" class="form-control" id="correo" name="correo" required placeholder="Correo electrónico">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            </div>
                                            <input type="password" class="form-control" id="contrasena" name="contrasena" required placeholder="Contraseña">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
                                    <div id="resultado" class="text-center"></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();

            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;

            const credenciales = {
                correo: correo,
                contrasena: contrasena
            };

            try {
                const response = await fetch("https://ee59-190-217-65-135.ngrok-free.app/api/Usuarios/login", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(credenciales)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error de login: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                alert("Inicio de sesión exitoso. Bienvenido " + data.user.nombreUsuario);
                localStorage.setItem("nombreUsuario", data.user.nombreUsuario);
                window.location.href = "index.html";

            } catch (error) {
                document.getElementById('resultado').textContent = 'Inicio de sesión fallido: ' + error.message;
            }
        });
    </script>

</body>

</html>
