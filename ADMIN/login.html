<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SB Admin 2 - Login</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                    </div>
                                    <form id="form-login">
                                        <input type="email" id="correo" name="correo" required placeholder="Correo">
                                        <input type="password" id="contrasena" name="contrasena" required placeholder="Contraseña">
                                        <button type="submit">Iniciar sesión</button>
                                    </form>                                    
                        
                                    <div id="resultado"></div>
                                    
                                    <hr>                    
                                    <div class="text-center">
                                        <a class="small" href="register.html">Create an Account!</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

    <script>
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();
        
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;
        
            const credenciales = {
                correo: correo,
                contrasena: contrasena
            };
        
            try {
                const response = await fetch("https://c0c4-179-1-86-125.ngrok-free.app/api/Usuarios/login", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(credenciales)
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error de login: ${response.status} - ${errorText}`);
                }
        
                const data = await response.json();
                console.log('Login exitoso:', data);
                
                alert("Inicio de sesión exitoso. Bienvenido " + data.user.nombreUsuario);
                // Guardar el nombre del usuario en localStorage
                localStorage.setItem("nombreUsuario", data.user.nombreUsuario);
                // Redireccionar a index.html
                window.location.href = "index.html";

            } catch (error) {
                console.error('Error de conexión:', error.message);
                alert('Inicio de sesión fallido: ' + error.message);
            }
        });
        </script>
        
    
    

</body>

</html>
