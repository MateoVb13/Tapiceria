<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Clientes - Dashboard</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <style>
        .action-buttons {
            white-space: nowrap;
        }
        .action-buttons button {
            margin: 0 3px;
        }
    </style>
</head>

<body id="page-top">

    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-laugh-wink"></i>
                </div>
                <div class="sidebar-brand-text mx-3">SB Admin</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-fw fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <hr class="sidebar-divider">
            <li class="nav-item active">
                <a class="nav-link" href="clientes.html">
                    <i class="fas fa-fw fa-user"></i>
                    <span>Clientes</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="empleados.html">
                    <i class="fas fa-fw fa-users"></i>
                    <span>Empleados</span>
                </a>
            </li>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Usuario</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Begin Page Content -->
                <div class="container-fluid">
                    <h1 class="h3 mb-2 text-gray-800">Lista de Clientes</h1>
                    <div class="card shadow mb-4">
                        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                            <h6 class="m-0 font-weight-bold text-primary">Clientes Registrados</h6>
                            <button class="btn btn-primary btn-sm" data-toggle="modal" data-target="#addClienteModal">
                                <i class="fas fa-plus"></i> Agregar Cliente
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="clientesTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre Completo</th>
                                            <th>Contacto</th>
                                            <th>Dirección</th>
                                            <th>Usuario</th>
                                            <th>Correo</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="clientesBody">
                                        <!-- Aquí se insertarán los datos -->
                                    </tbody>
                                </table>                                
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; Tu Sitio 2025</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Modal para Agregar Cliente -->
    <div class="modal fade" id="addClienteModal" tabindex="-1" role="dialog" aria-labelledby="addClienteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addClienteModalLabel">Agregar Nuevo Cliente</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addClienteForm">
                        <div class="form-group">
                            <label for="nombreCompleto">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="contacto">Contacto</label>
                            <input type="text" class="form-control" id="contacto" placeholder="Teléfono, email, etc.">
                        </div>
                        <div class="form-group">
                            <label for="direccion">Dirección</label>
                            <input type="text" class="form-control" id="direccion">
                        </div>
                        <div class="form-group">
                            <label for="idUsuario">ID Usuario (opcional)</label>
                            <input type="number" class="form-control" id="idUsuario" placeholder="Dejar vacío si no tiene usuario asociado">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveClienteBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Cliente -->
    <div class="modal fade" id="editClienteModal" tabindex="-1" role="dialog" aria-labelledby="editClienteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editClienteModalLabel">Editar Cliente</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editClienteForm">
                        <input type="hidden" id="editIdCliente">
                        <div class="form-group">
                            <label for="editNombreCompleto">Nombre Completo</label>
                            <input type="text" class="form-control" id="editNombreCompleto" required>
                        </div>
                        <div class="form-group">
                            <label for="editContacto">Contacto</label>
                            <input type="text" class="form-control" id="editContacto" placeholder="Teléfono, email, etc.">
                        </div>
                        <div class="form-group">
                            <label for="editDireccion">Dirección</label>
                            <input type="text" class="form-control" id="editDireccion">
                        </div>
                        <div class="form-group">
                            <label for="editIdUsuario">ID Usuario (opcional)</label>
                            <input type="number" class="form-control" id="editIdUsuario" placeholder="Dejar vacío si no tiene usuario asociado">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="updateClienteBtn">Actualizar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Confirmar Eliminación</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>¿Está seguro que desea eliminar a este cliente?</p>
                    <p id="deleteClienteName" class="font-weight-bold"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript para CRUD de clientes -->
    <script>
        // URL base de la API
        const API_URL = " https://eae5-179-1-86-116.ngrok-free.app/api/Clientes";
        let clientesList = [];
        
        // Al cargar la página
        document.addEventListener('DOMContentLoaded', loadClientes);
        
        // Cargar clientes desde la API
        async function loadClientes() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al obtener clientes: ${response.status} - ${errorText}`);
                }
        
                clientesList = await response.json();
                renderClientesTable();
                console.log('Clientes cargados:', clientesList);
            } catch (error) {
                console.error('Error al cargar clientes:', error.message);
                alert('No se pudieron cargar los clientes: ' + error.message);
            }
        }
        
        // Renderizar tabla de clientes
        function renderClientesTable() {
            const tablaBody = document.getElementById('clientesBody');
            tablaBody.innerHTML = ''; // Limpiar antes de insertar
        
            clientesList.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cliente.idCliente}</td>
                    <td>${cliente.nombreCompleto || ''}</td>
                    <td>${cliente.contacto || ''}</td>
                    <td>${cliente.direccion || ''}</td>
                    <td>${cliente.nombreUsuario || ''}</td>
                    <td>${cliente.correoUsuario || ''}</td>
                    <td class="action-buttons">
                        <button class="btn btn-info btn-sm edit-btn" data-id="${cliente.idCliente}">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="${cliente.idCliente}" data-name="${cliente.nombreCompleto}">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                `;
                tablaBody.appendChild(row);
            });
            
            // Agregar event listeners a los botones
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', handleEditClick);
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', handleDeleteClick);
            });
        }
        
        // Agregar cliente
        document.getElementById('saveClienteBtn').addEventListener('click', async function() {
            // Validar formulario
            const nombreCompleto = document.getElementById('nombreCompleto').value.trim();
            if (!nombreCompleto) {
                alert('El nombre completo es obligatorio');
                return;
            }
            
            try {
                const idUsuarioValue = document.getElementById('idUsuario').value.trim();
                
                const clienteData = {
                    nombreCompleto: nombreCompleto,
                    contacto: document.getElementById('contacto').value.trim() || null,
                    direccion: document.getElementById('direccion').value.trim() || null,
                    idUsuario: idUsuarioValue ? parseInt(idUsuarioValue) : null
                };
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(clienteData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al agregar cliente: ${response.status} - ${errorText}`);
                }
                
                // Recargar clientes
                await loadClientes();
                
                // Cerrar modal y limpiar formulario
                $('#addClienteModal').modal('hide');
                document.getElementById('addClienteForm').reset();
                
                // Mostrar confirmación
                alert('Cliente agregado correctamente');
                
            } catch (error) {
                console.error('Error al agregar cliente:', error.message);
                alert('No se pudo agregar el cliente: ' + error.message);
            }
        });
        
        // Manejar clic en botón Editar
        function handleEditClick(event) {
            const id = event.currentTarget.getAttribute('data-id');
            const cliente = clientesList.find(c => c.idCliente === parseInt(id));
            
            if (cliente) {
                // Llenar formulario con datos del cliente
                document.getElementById('editIdCliente').value = cliente.idCliente;
                document.getElementById('editNombreCompleto').value = cliente.nombreCompleto || '';
                document.getElementById('editContacto').value = cliente.contacto || '';
                document.getElementById('editDireccion').value = cliente.direccion || '';
                document.getElementById('editIdUsuario').value = cliente.idUsuario || '';
                
                // Mostrar modal
                $('#editClienteModal').modal('show');
            }
        }
        
        // Actualizar cliente
        document.getElementById('updateClienteBtn').addEventListener('click', async function() {
            // Validar formulario
            const nombreCompleto = document.getElementById('editNombreCompleto').value.trim();
            const idCliente = document.getElementById('editIdCliente').value;
            
            if (!nombreCompleto) {
                alert('El nombre completo es obligatorio');
                return;
            }
            
            try {
                const idUsuarioValue = document.getElementById('editIdUsuario').value.trim();
                
                const clienteData = {
                    idCliente: parseInt(idCliente),
                    nombreCompleto: nombreCompleto,
                    contacto: document.getElementById('editContacto').value.trim() || null,
                    direccion: document.getElementById('editDireccion').value.trim() || null,
                    idUsuario: idUsuarioValue ? parseInt(idUsuarioValue) : null
                };
                
                const response = await fetch(`${API_URL}/${idCliente}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(clienteData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al actualizar cliente: ${response.status} - ${errorText}`);
                }
                
                // Recargar clientes
                await loadClientes();
                
                // Cerrar modal
                $('#editClienteModal').modal('hide');
                
                // Mostrar confirmación
                alert('Cliente actualizado correctamente');
                
            } catch (error) {
                console.error('Error al actualizar cliente:', error.message);
                alert('No se pudo actualizar el cliente: ' + error.message);
            }
        });
        
        // Manejar clic en botón Eliminar
        function handleDeleteClick(event) {
            const id = event.currentTarget.getAttribute('data-id');
            const name = event.currentTarget.getAttribute('data-name');
            
            // Mostrar nombre en modal de confirmación
            document.getElementById('deleteClienteName').textContent = name;
            
            // Configurar botón de confirmación
            document.getElementById('confirmDeleteBtn').setAttribute('data-id', id);
            
            // Mostrar modal de confirmación
            $('#deleteConfirmModal').modal('show');
        }
        
        // Eliminar cliente
        document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
            const idCliente = this.getAttribute('data-id');
            
            try {
                const response = await fetch(`${API_URL}/${idCliente}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al eliminar cliente: ${response.status} - ${errorText}`);
                }
                
                // Recargar clientes
                await loadClientes();
                
                // Cerrar modal
                $('#deleteConfirmModal').modal('hide');
                
                // Mostrar confirmación
                alert('Cliente eliminado correctamente');
                
            } catch (error) {
                console.error('Error al eliminar cliente:', error.message);
                alert('No se pudo eliminar el cliente: ' + error.message);
                // Cerrar modal
                $('#deleteConfirmModal').modal('hide');
            }
        });
    </script>

</body>

</html>
